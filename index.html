<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Coburn Cars Solutions</title>
	<!-- Requires Tailwind CSS CDN for the utility classes to render -->
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#222121] text-[#DCDBDB] font-sans">

  <!-- Header Navigation -->
  <header class="fixed top-0 left-0 w-full z-40 bg-[#222121]/80 backdrop-blur-md border-b border-[#DCDBDB]/10">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="#home" class="text-2xl font-bold text-[#DCDBDB] tracking-wide">Coburn Cars Solutions</a>
      <nav class="hidden md:flex items-center space-x-8 text-sm font-medium uppercase tracking-wider">
        <a href="#home" class="text-[#DCDBDB] hover:text-[#3C4B5C] transition-colors">Home</a>
        <a href="#the-collection" class="text-[#d1d5db] hover:text-[#DCDBDB] transition-colors">The Collection</a>
        <a href="#contact-us" class="text-[#d1d5db] hover:text-[#DCDBDB] transition-colors">Contact Us</a>
      </nav>
    </div>
  </header>

  <!-- Fullscreen Hero Section (100vh) -->
  <section id="home" class="relative w-full h-screen flex items-center justify-start overflow-hidden">
    <!-- Background Image & Gradient Overlay -->
    <div class="absolute inset-0 z-0">
      <img src="hero-car.jpg" alt="Luxury Wedding Car" class="w-full h-full object-cover filter brightness-75" />
      <div class="absolute inset-0 bg-gradient-to-r from-[#222121]/90 via-[#222121]/60 to-transparent"></div>
    </div>

    <!-- Left-Aligned Hero Content -->
    <div class="relative z-10 w-full max-w-7xl mx-auto px-6">
      <div class="max-w-2xl text-left">
        <h1 class="text-4xl sm:text-6xl font-bold text-[#DCDBDB] mb-6">Title</h1>
        <h2 class="text-lg sm:text-xl text-[#DCDBDB] mb-8">Subtitle</h2>
        <a href="#the-collection" class="inline-block px-8 py-4 rounded-full bg-[#1F68BF] hover:bg-[#3C4B5C] text-[#DCDBDB] font-bold text-xs uppercase tracking-widest transition-all shadow-lg">
          Explore The Collection
        </a>
      </div>
    </div>
  </section>
	<main>
		<div class=
	</main>
</body>
</html>
